[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-level-1"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.13.1",
    "numpy>=1.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "AuraDauntless"

[tool.flwr.app.components]
serverapp = "fl_level_1.server_app:app"
clientapp = "fl_level_1.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
